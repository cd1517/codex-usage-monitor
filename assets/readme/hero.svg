<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="440" viewBox="0 0 1200 440"
     role="img" aria-labelledby="title desc">
  <title id="title">Comoni</title>
  <desc id="desc">macOS 菜单栏用量浮窗，将 Codex 的 5 小时和 1 周剩余额度横条贴在 ChatGPT 标题栏，并在悬停时从横条下方弹出详情窗口。</desc>

  <rect width="1200" height="440" rx="28" fill="#0C0D10"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g transform="translate(60 54)">
      <circle cx="8" cy="8" r="8" fill="#2997FF"/>
      <path d="M10.5 1.5 5 9h4l-1.5 5.5L13 7h-4z" fill="#FFFFFF"/>
      <text x="28" y="14" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2">MACOS MENU BAR UTILITY</text>
    </g>

    <text x="60" y="170" fill="#F5F7FA" font-size="58" font-weight="720">Comoni</text>

    <text x="60" y="258" fill="#D0D7DE" font-size="27" font-weight="560">把剩余额度，放在标题栏上。</text>
    <text x="60" y="298" fill="#8B949E" font-size="20">不抢焦点 · 自动跟随 · 悬停展开详情</text>

    <g transform="translate(60 342)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <rect width="140" height="38" rx="19" fill="#171A1F" stroke="#30363D"/>
      <text x="70" y="25" fill="#D0D7DE" text-anchor="middle">macOS 14+</text>
      <rect x="152" width="128" height="38" rx="19" fill="#171A1F" stroke="#30363D"/>
      <text x="216" y="25" fill="#D0D7DE" text-anchor="middle">READ ONLY</text>
      <rect x="292" width="104" height="38" rx="19" fill="#171A1F" stroke="#30363D"/>
      <text x="344" y="25" fill="#D0D7DE" text-anchor="middle">SWIFT</text>
    </g>
  </g>

  <g id="interface-proof" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="644" y="36" width="500" height="368" rx="22" fill="#FFFFFF" stroke="#30363D" stroke-width="2"/>
    <path d="M644 88h500" stroke="#E5E7EB"/>
    <circle cx="676" cy="62" r="7" fill="#FF5F57"/>
    <circle cx="700" cy="62" r="7" fill="#FEBB2E"/>
    <circle cx="724" cy="62" r="7" fill="#28C840"/>
    <path d="M751 56v13M746 60l5-5 5 5" fill="none" stroke="#A0A4AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1092" y="54" width="20" height="16" rx="4" fill="none" stroke="#A0A4AA" stroke-width="2"/>
    <rect x="1120" y="54" width="14" height="16" rx="4" fill="none" stroke="#A0A4AA" stroke-width="2"/>
    <text x="1120" y="389" fill="#A0A4AA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" text-anchor="end">UI PREVIEW</text>

    <g id="chatgpt-window">
      <path d="M776 88v316" stroke="#ECEEF0"/>
      <rect x="645" y="89" width="130" height="314" fill="#FAFAFA"/>
      <text x="666" y="122" fill="#34363A" font-size="20" font-weight="650">Codex</text>
      <circle cx="752" cy="116" r="9" fill="none" stroke="#A0A4AA" stroke-width="2"/>
      <path d="M660 154h92M660 184h76M660 214h88M660 244h68" stroke="#D9DCE0" stroke-width="9" stroke-linecap="round"/>
      <circle cx="938" cy="272" r="20" fill="none" stroke="#D3D5D8" stroke-width="4"/>
      <path d="M924 272h28M938 258v28" stroke="#D3D5D8" stroke-width="4" stroke-linecap="round"/>
      <rect x="818" y="340" width="286" height="42" rx="16" fill="#FFFFFF" stroke="#E1E3E6"/>
    </g>

    <g id="compact-usage-strip" transform="translate(832 44)">
      <rect width="296" height="44" rx="14" fill="none"/>
      <text x="15" y="28" fill="#85888D" font-size="18">5小时</text>
      <text x="71" y="28" fill="#292B2F" font-size="20" font-weight="650">82%</text>
      <path d="M126 10 116 24h8l-3 10 11-16h-8z" fill="#2997FF"/>
      <text x="150" y="28" fill="#85888D" font-size="18">1周</text>
      <text x="187" y="28" fill="#292B2F" font-size="20" font-weight="650">69%</text>
      <circle cx="257" cy="22" r="2.2" fill="#85888D"/>
      <circle cx="266" cy="22" r="2.2" fill="#85888D"/>
      <circle cx="275" cy="22" r="2.2" fill="#85888D"/>
    </g>

    <g id="hover-detail" transform="translate(832 100)">
      <rect x="4" y="7" width="292" height="160" rx="16" fill="#000000" opacity="0.10"/>
      <rect width="296" height="160" rx="16" fill="#F7F7F8" stroke="#D8DADF"/>
      <g font-size="18">
        <text x="18" y="32" fill="#7A7D82">5 小时重置</text>
        <text x="278" y="32" fill="#292B2F" text-anchor="end" font-weight="560">今天 18:30</text>
        <text x="18" y="66" fill="#7A7D82">1 周重置</text>
        <text x="278" y="66" fill="#292B2F" text-anchor="end" font-weight="560">9月 4日</text>
        <path d="M18 82h260" stroke="#D8DADF"/>
        <text x="18" y="110" fill="#7A7D82">限额重置</text>
        <text x="278" y="110" fill="#292B2F" text-anchor="end" font-weight="650">可用 1 次</text>
        <text x="18" y="144" fill="#7A7D82">有效期至</text>
        <text x="278" y="144" fill="#292B2F" text-anchor="end" font-weight="560">9月 30日</text>
      </g>
    </g>

    <g id="hover-cue" transform="translate(680 286)">
      <path d="M0 18h108c24 0 30-20 54-20h5" fill="none" stroke="#2997FF" stroke-width="2" stroke-dasharray="5 6"/>
      <circle cx="168" cy="-2" r="4" fill="#2997FF"/>
      <text x="0" y="47" fill="#2997FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">HOVER TO REVEAL</text>
    </g>
  </g>
</svg>
